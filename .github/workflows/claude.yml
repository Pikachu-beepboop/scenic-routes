name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  checks: write
jobs:
  claude:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.author_association == 'OWNER' ||
         github.event.pull_request.author_association == 'MEMBER' ||
         github.event.pull_request.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issues' &&
        (github.event.issue.author_association == 'OWNER' ||
         github.event.issue.author_association == 'MEMBER' ||
         github.event.issue.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Supabase MCP server
        run: npm install -g @supabase/mcp-server-supabase@0.8.2

      - name: Debug Supabase MCP server
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" && echo "token set (${#SUPABASE_ACCESS_TOKEN} chars)" || echo "TOKEN IS EMPTY"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"debug","version":"0"}}}' \
            | mcp-server-supabase --project-ref=vwuqidilqrkcbyocrwor

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          MCP_TIMEOUT: "60000"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          additional_permissions: |
            workflows: write
          claude_args: >-
            --mcp-config '{"mcpServers":{"supabase":{"command":"mcp-server-supabase","args":["--project-ref=vwuqidilqrkcbyocrwor"],"env":{"SUPABASE_ACCESS_TOKEN":"${{ secrets.SUPABASE_ACCESS_TOKEN }}"}}}}'
            --allowedTools "mcp__supabase__list_tables,mcp__supabase__list_migrations,mcp__supabase__apply_migration,mcp__supabase__execute_sql,mcp__supabase__generate_typescript_types,mcp__supabase__list_extensions,mcp__supabase__search_docs,mcp__supabase__confirm_cost"
