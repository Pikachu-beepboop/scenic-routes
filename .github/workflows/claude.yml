name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  checks: write
jobs:
  claude:
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          # Supabase MCP server: non-interactive (no browser OAuth), authenticated
          # via the SUPABASE_ACCESS_TOKEN secret passed through the process env.
          mcp_config: |
            {
              "mcpServers": {
                "supabase": {
                  "command": "npx",
                  "args": ["-y", "@supabase/mcp-server-supabase@latest"],
                  "env": {
                    "SUPABASE_ACCESS_TOKEN": "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
                  }
                }
              }
            }
          claude_args: --allowedTools "mcp__supabase"
