name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
  checks: write
jobs:
  claude:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.author_association == 'OWNER' ||
         github.event.pull_request.author_association == 'MEMBER' ||
         github.event.pull_request.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issues' &&
        (github.event.issue.author_association == 'OWNER' ||
         github.event.issue.author_association == 'MEMBER' ||
         github.event.issue.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          # Step-level, so the Claude Code client process itself reads it
          # when waiting for the Supabase MCP server to finish starting.
          MCP_TIMEOUT: "60000"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          additional_permissions: |
            workflows: write
          claude_args: >-
            --mcp-config '{"mcpServers":{"supabase":{"command":"npx","args":["-y","@supabase/mcp-server-supabase@0.8.2","--project-ref=vwuqidilqrkcbyocrwor"],"env":{"SUPABASE_ACCESS_TOKEN":"${{ secrets.SUPABASE_ACCESS_TOKEN }}"}}}}'
            --allowedTools "mcp__supabase__list_tables,mcp__supabase__list_migrations,mcp__supabase__apply_migration,mcp__supabase__execute_sql,mcp__supabase__generate_typescript_types,mcp__supabase__list_extensions,mcp__supabase__search_docs,mcp__supabase__confirm_cost"
